[package]
name = "fetris"
version = "0.1.0"
description = "Funky offline Tetris"
authors = ["baeks"]
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "fetris_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# LAN 릴레이 서버(데스크탑 USB/Thunderbolt 직결 대전용)
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "sync", "io-util", "time"] }
tokio-tungstenite = "0.24"
futures-util = "0.3"
if-addrs = "0.13"

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = "s"
strip = true
